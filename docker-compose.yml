services:
  postgres:
    image: postgres:16-alpine
    container_name: solradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: solradar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solradar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: solradar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: solradar-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/solradar
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretjwtkeychangeinprod_mustbe32chars
      JWT_REFRESH_SECRET: refreshsecretkeychangeinprod_32chars
      HELIUS_WEBHOOK_SECRET: test_helius_webhook_secret
      TELEGRAM_BOT_TOKEN: 123456789:dummy_token_for_testing
      BILLING_PROVIDER: noop

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: solradar-worker
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/solradar
      REDIS_URL: redis://redis:6379

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: solradar-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      PORT: 3000

volumes:
  postgres_data:
  redis_data:
